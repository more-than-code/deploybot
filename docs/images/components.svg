<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" aria-labelledby="t d">
<title id="t">Deploybot components</title>
<desc id="d">People and AI agents reach the bot-control-plane console and MCP gateway; both go through the API, which alone writes PostgreSQL. On each host, bot-agent dials out to the API, and a root runner checks the host allowlist before running containers or systemd units.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2328; }
  .ts { font-size: 12px; fill: #59636e; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; }
  .plane { fill: #eeedfe; stroke: #534ab7; }
  .plane-t { fill: #3c3489; }
  .host { fill: #e1f5ee; stroke: #0f6e56; }
  .host-t { fill: #085041; }
  .inner { fill: #ffffff; stroke: #b4b2a9; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #e6edf3; }
    .ts { fill: #9198a1; }
    .box { fill: #151b23; stroke: #3d444d; }
    .plane { fill: #26215c; stroke: #afa9ec; }
    .plane-t { fill: #cecbf6; }
    .host { fill: #04342c; stroke: #5dcaa5; }
    .host-t { fill: #9fe1cb; }
    .inner { fill: #0d1117; stroke: #5f5e5a; }
    .arr { stroke: #9c9a92; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box" x="90" y="30" width="200" height="56" rx="8" stroke-width="1"/>
<text class="th" x="190" y="51" text-anchor="middle">People</text>
<text class="ts" x="190" y="71" text-anchor="middle">In a browser</text>
<rect class="box" x="390" y="30" width="200" height="56" rx="8" stroke-width="1"/>
<text class="th" x="490" y="51" text-anchor="middle">AI agents</text>
<text class="ts" x="490" y="71" text-anchor="middle">Any MCP client, as you</text>

<rect class="plane" x="40" y="130" width="600" height="210" rx="20" stroke-width="1"/>
<text class="th plane-t" x="620" y="154" text-anchor="end">bot-control-plane</text>
<text class="ts plane-t" x="620" y="171" text-anchor="end">Hosted or self-hosted, AGPL-3.0</text>
<rect class="inner" x="70" y="180" width="180" height="56" rx="8" stroke-width="1"/>
<text class="th" x="160" y="201" text-anchor="middle">Console</text>
<text class="ts" x="160" y="221" text-anchor="middle">Web UI</text>
<rect class="inner" x="430" y="180" width="180" height="56" rx="8" stroke-width="1"/>
<text class="th" x="520" y="201" text-anchor="middle">MCP gateway</text>
<text class="ts" x="520" y="221" text-anchor="middle">OAuth, plan and confirm</text>
<rect class="inner" x="250" y="260" width="180" height="56" rx="8" stroke-width="1"/>
<text class="th" x="340" y="281" text-anchor="middle">API</text>
<text class="ts" x="340" y="301" text-anchor="middle">Roles, catalog, audit</text>
<rect class="inner" x="470" y="260" width="150" height="56" rx="8" stroke-width="1"/>
<text class="th" x="545" y="281" text-anchor="middle">PostgreSQL</text>
<text class="ts" x="545" y="301" text-anchor="middle">Secrets encrypted</text>

<line class="arr" x1="190" y1="86" x2="168" y2="178" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="86" x2="512" y2="178" marker-end="url(#arrow)"/>
<path class="arr" d="M160 236 L160 288 L248 288" marker-end="url(#arrow)"/>
<path class="arr" d="M520 236 L520 248 L340 248 L340 258" marker-end="url(#arrow)"/>
<line class="arr" x1="430" y1="288" x2="468" y2="288" marker-end="url(#arrow)"/>

<rect class="host" x="40" y="390" width="600" height="160" rx="20" stroke-width="1"/>
<text class="th host-t" x="620" y="414" text-anchor="end">Your hosts</text>
<text class="ts host-t" x="620" y="431" text-anchor="end">Pi, mini PC, VPS, cloud VM</text>
<rect class="inner" x="64" y="460" width="170" height="56" rx="8" stroke-width="1"/>
<text class="th" x="149" y="481" text-anchor="middle">bot-agent</text>
<text class="ts" x="149" y="501" text-anchor="middle">Unprivileged, Apache-2.0</text>
<rect class="inner" x="262" y="460" width="170" height="56" rx="8" stroke-width="1"/>
<text class="th" x="347" y="481" text-anchor="middle">Root runner</text>
<text class="ts" x="347" y="501" text-anchor="middle">Checks host allowlist</text>
<rect class="inner" x="460" y="460" width="160" height="56" rx="8" stroke-width="1"/>
<text class="th" x="540" y="481" text-anchor="middle">Docker, systemd</text>
<text class="ts" x="540" y="501" text-anchor="middle">Runs your entries</text>

<path class="arr" d="M149 458 L149 370 L340 370 L340 318" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="360">Dials out, no open ports</text>
<line class="arr" x1="234" y1="488" x2="260" y2="488" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="488" x2="458" y2="488" marker-end="url(#arrow)"/>
</svg>
